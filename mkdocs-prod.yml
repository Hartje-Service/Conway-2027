site_name: Conway 2027
site_description: Výrobní manuál pro modely C 1.0, C 2.0, C 4.0, S 2.0 a S 3.0
site_author: Hartje Production
docs_dir: docs
site_url: "https://hartje-service.github.io/Conway-2027/"
use_directory_urls: false


theme:
  name: material
  language: cs
  palette:
    primary: '#0b4ea2'
    accent: '#009fe3'

  custom_dir: overrides

extra_css:
  - styles/extra.css

plugins:
  - search
  - include-markdown:
      preserve_includer_indent: false
      recursive: true
      heading_offset: 0
      encoding: utf-8
      rewrite_relative_urls: true
      dedent: true
      comments: true
  - macros

markdown_extensions:
  - md_in_html
  - tables
  - admonition
  - pymdownx.snippets
  - attr_list

exclude_docs: |
  modules/**/*.md

nav: 
  - "index.md"
  
  - Obecné:
      - Specifikace: obecne/specifikace.md
      - Bezpečnost: obecne/bezpecnost.md
      - Nástroje: obecne/nastroje.md
  - Modely:
      - C 1.0:
          - Přehled: modely/cairon-c-1-0/Přehled.md
          - Montáž: modely/cairon-c-1-0/Montáž.md
          - Kusovníky: modely/cairon-c-1-0/Kusovníky.md
      - C 2.0:
          - Přehled: modely/cairon-c-2-0/Přehled.md
          - Montáž: modely/cairon-c-2-0/Montáž.md
          - Kusovníky: modely/cairon-c-2-0/Kusovníky.md
      - C 4.0:
          - Přehled: modely/cairon-c-4-0/Přehled.md
          - Montáž: modely/cairon-c-4-0/Montáž.md
          - Kusovníky: modely/cairon-c-4-0/Kusovníky.md
      - S 2.0:
          - Přehled: modely/cairon-s-2-0/Přehled.md
          - Montáž: modely/cairon-s-2-0/Montáž.md
          - Kusovníky: modely/cairon-s-2-0/Kusovníky.md
      - S 3.0:
          - Přehled: modely/cairon-s-3-0/Přehled.md
          - Montáž: modely/cairon-s-3-0/Montáž.md
          - Kusovníky: modely/cairon-s-3-0/Kusovníky.md                
  - Přílohy:
      - Tabulka momentů: prilohy/tabulka-momentu.md
      - Výkresy rámů: prilohy/vykresy-ramu.md
      - Soupis spojovacího materálu: prilohy/spoj-mat.md
      - Seznam kompomentů: prilohy/Seznam komponentu.md